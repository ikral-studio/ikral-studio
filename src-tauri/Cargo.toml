[package]
name = "ikral-studio"
version = "0.1.0"
description = "IKRAL Studio"
authors = ["David González"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/ikral-studio/ikral-studio"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["protocol-asset"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-drag = "2.1.1"
